[package]
name = "musicindex-fetch"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
musicindex-tags = { path = "../tags" }
musicindex-value = { path = "../value" }
reqwest = { version = "0.13", features = ["blocking"] }
serde_json = "1"
sha2 = "0.10"
stophammer-parser = { git = "https://github.com/InTheMorning/stophammer-parser", rev = "7bd898a36eea2aeabfa17b2a8a2e9f192af5472c", default-features = false }
tempfile = "3"

[lints.clippy]
pedantic = "warn"
