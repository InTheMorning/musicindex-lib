[package]
name = "musicindex-fetch"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
musicindex-tags = { path = "../tags" }
musicindex-value = { path = "../value" }
reqwest = { version = "0.13", features = ["blocking", "brotli", "deflate", "gzip"] }
serde_json = "1"
sha2 = "0.10"
stophammer-parser = { git = "https://github.com/InTheMorning/stophammer-parser", rev = "72a823886de00afde17d759c031a3b305e343b8a", default-features = false }
tempfile = "3"

[dev-dependencies]
# The tests compress a feed body with the codecs that reqwest uses.
brotli = "9"
flate2 = "1"

[lints.clippy]
pedantic = "warn"
