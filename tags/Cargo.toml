[package]
name = "musicindex-tags"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
id3 = "1.17"
lofty = "0.22"
musicindex-transcript = { path = "../transcript" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = "warn"
